<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectChat</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="chat-app-wrapper">
        <!-- COLUNA DA ESQUERDA: PERFIL E CONTATOS -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="my-profile">
                    <div class="avatar" id="myAvatar">👤</div>
                    <div class="my-info">
                        <h3 id="myNameDisplay">Meu Perfil</h3>
                        <span id="myPhoneDisplay">Carregando...</span>
                    </div>
                </div>
                <button class="btn-add-contact" id="btnAddContact" title="Adicionar número">+</button>
            </div>

            <div class="contacts-list" id="contactsList">
                <div class="contact-item active">
                    <div class="avatar-chat">💬</div>
                    <div class="contact-info">
                        <h4>Sala Geral</h4>
                        <p>Histórico global do chat</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- COLUNA DA DIREITA: CONVERSA PRINCIPAL -->
        <main class="chat-panel">
            <header class="chat-header">
                <div class="chat-header-info">
                    <button class="btn-menu-toggle" id="btnMenuToggle">☰</button>
                    <div class="avatar-chat">💬</div>
                    <div>
                        <h2>Sala Geral</h2>
                        <span class="status-online">● Online</span>
                    </div>
                </div>
            </header>

            <section class="messages-container" id="messagesContainer">
                <!-- Balões aparecem aqui -->
            </section>

            <footer class="chat-input-bar">
                <input type="text" id="inputMessage" placeholder="Digite uma mensagem..." autocomplete="off">
                <button id="btnSend" class="btn-send">➤</button>
            </footer>
        </main>
    </div>

    <!-- MODAL DE CADASTRO (Só aparece se você ainda não tiver nome/telefone) -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <div class="modal-icon">💬</div>
            <h2>Identifique-se</h2>
            <p>Digite seu nome e telefone para entrar no chat.</p>
            <input type="text" id="inputName" placeholder="Seu Nome">
            <input type="text" id="inputPhone" placeholder="Seu Telefone (ex: 41 99999-8888)">
            <button id="btnEnter">Entrar no Chat</button>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
