<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConnectChat</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="chat-app-wrapper">
      <!-- COLUNA DA ESQUERDA: PERFIL E CONTATOS -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <button class="my-profile" id="btnMyProfile" type="button" aria-haspopup="dialog" aria-label="Abrir meu perfil" disabled>
            <span class="avatar" id="myAvatar" aria-hidden="true">👤</span>
            <span class="my-info">
              <strong id="myNameDisplay">Meu perfil</strong>
              <span id="myPhoneDisplay">Carregando...</span>
            </span>
          </button>
          <div>
            <!-- TROCAR PERFIL / SAIR -->
            <button
              class="btn-action-icon"
              id="btnResetProfile"
              title="Sair / Trocar meu número"
            >
              🚪
            </button>
            <button
              class="btn-add-contact"
              id="btnAddContact"
              title="Adicionar número"
            >
              +
            </button>
          </div>
        </div>

        <div class="contacts-list" id="contactsList">
          <div class="contact-item active">
            <div class="avatar-chat">💬</div>
            <div class="contact-info">
              <h4>Sala Geral</h4>
              <p>Histórico global do chat</p>
            </div>
          </div>
        </div>
      </aside>

      <!-- COLUNA DA DIREITA: CONVERSA PRINCIPAL -->
      <main class="chat-panel">
        <header class="chat-header">
          <div class="chat-header-info">
            <button class="btn-menu-toggle" id="btnMenuToggle">☰</button>
            <div class="avatar-chat">💬</div>
            <div>
              <h2>Sala Geral</h2>
              <span class="status-online">● Online</span>
            </div>
          </div>
          <div style="display: flex; gap: 8px; align-items: center">
            <button
              class="btn-theme-toggle"
              id="btnThemeToggle"
              title="Alternar Modo Noturno"
            >
              🌙
            </button>
            <!-- LIMPAR CONVERSA ATUAL -->
            <button
              class="btn-clear-chat"
              id="btnClearChat"
              title="Limpar mensagens desta conversa"
            >
              🗑️ Limpar Conversa
            </button>
          </div>
        </header>

        <section class="messages-container" id="messagesContainer">
          <!-- Balões aparecem aqui -->
        </section>

        <!-- BARRA NOVA: EMOJIS RÁPIDOS -->
        <div class="emoji-bar" id="emojiBar">
          <span class="emoji-btn" data-emoji="😀">😀</span>
          <span class="emoji-btn" data-emoji="😂">😂</span>
          <span class="emoji-btn" data-emoji="❤️">❤️</span>
          <span class="emoji-btn" data-emoji="👍">👍</span>
          <span class="emoji-btn" data-emoji="🔥">🔥</span>
          <span class="emoji-btn" data-emoji="🚀">🚀</span>
          <span class="emoji-btn" data-emoji="👋">👋</span>
          <span class="emoji-btn" data-emoji="🎉">🎉</span>
        </div>


        <footer class="chat-input-bar">
          <input
            type="text"
            id="inputMessage"
            placeholder="Digite uma mensagem..."
            autocomplete="off"
          />
          <button id="btnSend" class="btn-send">➤</button>
        </footer>
      </main>
    </div>

    <!-- MODAL DE CADASTRO (Só aparece se você ainda não tiver nome/telefone) -->
    <div class="modal-overlay" id="loginModal">
      <div class="modal-box">
        <div class="modal-icon">💬</div>
        <h2>Identifique-se</h2>
        <p>Digite seu nome e telefone para entrar no chat.</p>
        <input type="text" id="inputName" placeholder="Seu Nome" />
        <input
          type="text"
          id="inputPhone"
          placeholder="Seu Telefone (ex: 41 99999-8888)"
        />
        <button id="btnEnter">Entrar no Chat</button>
      </div>
    </div>

    <dialog class="profile-dialog" id="profileDialog" aria-labelledby="profileTitle">
      <form id="profileForm">
        <h2 id="profileTitle">Meu perfil</h2>
        <dl class="profile-identity">
          <dt>Nome</dt>
          <dd id="profileName"></dd>
          <dt>Telefone</dt>
          <dd id="profilePhone"></dd>
        </dl>
        <label for="profileAvatar">Avatar</label>
        <select id="profileAvatar">
          <option value="initials">Minhas iniciais</option>
          <option value="😊">😊 Sorriso</option>
          <option value="🎧">🎧 Fones</option>
          <option value="🚀">🚀 Foguete</option>
          <option value="🌻">🌻 Girassol</option>
          <option value="🐱">🐱 Gato</option>
        </select>
        <label for="profileBio">Sobre mim</label>
        <textarea id="profileBio" maxlength="140" rows="3"
          placeholder="Escreva uma frase sobre você"></textarea>
        <p class="profile-note">Seu avatar e sua descrição ficam salvos neste navegador.</p>
        <div class="profile-actions">
          <button type="button" id="btnCloseProfile">Fechar</button>
          <button type="submit">Salvar perfil</button>
        </div>
      </form>
    </dialog>

    <script src="/js/app.js"></script>
  </body>
</html>
